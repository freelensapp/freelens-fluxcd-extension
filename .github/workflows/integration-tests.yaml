name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  kind_version: 0.33.0 # datasource=github-releases depName=kubernetes-sigs/kind
  kubernetes_version: 1.37.0 # datasource=docker depName=kindest/node

jobs:
  test-integration:
    name: "integration tests with Freelens ${{ matrix.freelens_version }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          # No Freelens release has the v2 extension API yet; `main` is the
          # only ref that does.
          - freelens_version: main

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ matrix.freelens_version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ matrix.freelens_version }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      # The checksum sidecar is what the release publishes next to the tarball.
      # Freelens verifies a tarball against a `.tgz.sha256` beside it, so the
      # test installs the extension the way a user installs a release.
      - name: Pack plugin
        run: |
          set -eo pipefail
          pnpm pack
          for f in *.tgz; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Get extension path
        run: echo "EXTENSION_PATH=$(find $(pwd) -maxdepth 1 -name '*.tgz')" >> ${GITHUB_ENV}

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ matrix.freelens_version }}
          path: freelens

      # A branch moves, so the app build is cached per commit.
      - name: Get app commit
        run: echo "freelens_sha=$(git -C freelens rev-parse HEAD)" >> ${GITHUB_ENV}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts
      # packageManagerDependencies in a document of its own), so evaluate them
      # all and take the one that has the importer. The version carries a peer
      # suffix, e.g. 1.2.3(supports-color@8.1.1), which split drops.
      - name: Get Electron version
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' freelens/pnpm-lock.yaml)
          echo "electron_version=${electron_version}" >> ${GITHUB_ENV}

      # electron-builder's Electron zip downloader reads no cache directory
      # override and always writes into the OS-default Electron cache dir, so
      # that is what has to be cached.
      - name: Use Electron cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: ubuntu-24.04-arm-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-

      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-arm-turborepo-${{ hashFiles('freelens/**/package.json', 'freelens/**/pnpm-lock.yaml', 'freelens/turbo.json') }}
          restore-keys: |
            ubuntu-24.04-arm-turborepo-

      # The packaged Electron app does not depend on the extension under test
      # (the extension .tgz is installed at runtime by the integration tests),
      # so the build output is deterministic for a given Freelens commit.
      # Restore it to skip the expensive app build and electron-builder run on a
      # cache hit. The cache key is exact (no restore-keys) so a partial match
      # never produces a stale or incomplete dist directory. The matching save
      # step runs only after a successful build, so a failed build never
      # poisons the cache with an incomplete dist.
      - name: Restore Electron build cache
        id: electron-build-cache
        uses: actions/cache/restore@v6
        with:
          path: freelens/freelens/dist
          key: ubuntu-24.04-arm-electron-dist-${{ env.freelens_sha }}

      - name: Delete node packages from the previous build to avoid issues with pnpm
        run: rm -rf pnpm-lock.yaml node_modules

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Disable pre post scripts for pnpm
        working-directory: freelens
        run: pnpm config set enablePrePostScripts false --location project

      # The integration tests drive the packaged Electron app via Playwright's
      # `_electron` API, which uses Electron's own bundled Chromium, so
      # Playwright's browsers are never downloaded. `install-deps` still
      # apt-installs the shared libraries that Chromium (and thus the Electron
      # app) needs to launch under xvfb. Run the playwright that the app's
      # pnpm-lock.yaml pins, not `pnpx`, which fetches the latest release.
      - name: Install Playwright's OS dependencies
        working-directory: freelens
        run: pnpm --filter freelens exec playwright install-deps chromium

      - name: Build app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always --stream build

      - name: Copy tests from plugin to app
        run: |
          rm -f freelens/freelens/integration/__tests__/*
          cp integration/__tests__/* freelens/freelens/integration/__tests__

      - name: Start KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: freelens
          version: v${{ env.kind_version }}
          node_image: kindest/node:v${{ env.kubernetes_version }}
          wait: 5m

      - name: Build extra resources
        id: build-resources
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Get electron-builder path
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: |
          EB_PATH=$(node -e "console.log(require.resolve('electron-builder/cli'))")
          echo "ELECTRON_BUILDER_PATH=$EB_PATH" >> $GITHUB_ENV

      # electron-builder collects the modules to package with `pnpm list --prod`,
      # so app.asar gets only the production dependencies of freelens from the
      # regular workspace node_modules, as in the release build.
      - name: Build Electron app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: node "$ELECTRON_BUILDER_PATH" --publish never --linux dir --arm64
        env:
          npm_config_user_agent: pnpm

      # Save only after a successful build (this step is not reached if the
      # electron-builder run above failed), so the cache never holds a partial
      # dist directory.
      - name: Save Electron build cache
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/freelens/dist
          key: ${{ steps.electron-build-cache.outputs.cache-primary-key }}

      - name: Run integration tests
        id: integration-tests-linux
        working-directory: freelens
        run: |
          sudo chown root:root freelens/dist/linux*-unpacked/chrome-sandbox
          sudo chmod 4755 freelens/dist/linux*-unpacked/chrome-sandbox
          timeout 600 xvfb-run -a pnpm --color=always test:integration --reporter=verbose --reporter=github-actions --includeTaskLocation
        env:
          DEBUG: pw:browser
          TEST_KIND_CLUSTER_NAME: freelens
        continue-on-error: true

      - name: Run integration tests (retry)
        if: steps.integration-tests-linux.outcome == 'failure'
        working-directory: freelens
        run: |
          sudo chown root:root freelens/dist/linux*-unpacked/chrome-sandbox
          sudo chmod 4755 freelens/dist/linux*-unpacked/chrome-sandbox
          timeout 600 xvfb-run -a pnpm --color=always test:integration --reporter=verbose --reporter=github-actions --includeTaskLocation
        env:
          DEBUG: pw:browser
          TEST_KIND_CLUSTER_NAME: freelens
