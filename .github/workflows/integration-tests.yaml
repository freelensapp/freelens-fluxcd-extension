name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  kind_version: 0.33.0 # datasource=github-releases depName=kubernetes-sigs/kind
  kubernetes_version: 1.37.0 # datasource=docker depName=kindest/node

jobs:
  test-integration:
    name: "integration tests with Freelens ${{ matrix.freelens_version }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Freelens releases the extension supports, by their tags.
          - freelens_version: v2.0.0

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.11 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ matrix.freelens_version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ matrix.freelens_version }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The tests install this checkout in place, so Freelens loads the
      # extension from dist/.
      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      # Cache the .deb archives and package lists that `playwright install-deps`
      # downloads through apt, so re-runs reuse them instead of re-downloading.
      # apt is pointed at this project-local directory via a global config file
      # written in the install step below.
      - name: Use APT cache
        uses: actions/cache@v6
        with:
          path: .apt
          key: ubuntu-24.04-arm-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-apt-

      # The tests attach to Electron's own Chromium over CDP, so Playwright's
      # browsers are never downloaded. `install-deps` still apt-installs the
      # shared libraries that Chromium (and thus Electron) needs to launch
      # under xvfb. It runs the playwright that pnpm-lock.yaml pins.
      - name: Install Playwright's OS dependencies
        run: |
          set -eo pipefail
          # `playwright install-deps` runs its own `apt-get update`/`install`,
          # so the archive/list redirect has to be a global apt config file it
          # picks up rather than per-invocation `-o` flags. dpkg's status stays
          # at the system default, so packages still install into the runner.
          mkdir -p .apt/cache/archives/partial .apt/state/lists/partial
          sudo tee /etc/apt/apt.conf.d/00freelens-cache >/dev/null <<EOF
          Dir::Cache::archives "$PWD/.apt/cache/archives";
          Dir::State::lists "$PWD/.apt/state/lists";
          EOF
          pnpm exec playwright install-deps chromium
          # apt ran as root, so hand the cache dir back to the runner user for
          # the cache-save post step to read.
          sudo chown -R "$(id -u):$(id -g)" .apt

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ matrix.freelens_version }}
          path: freelens

      - name: Setup node for app
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts
      # packageManagerDependencies in a document of its own), so evaluate them
      # all and take the one that has the importer. The version carries a peer
      # suffix, e.g. 1.2.3(supports-color@8.1.1), which split drops.
      - name: Get Electron version
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' freelens/pnpm-lock.yaml)
          echo "electron_version=${electron_version}" >> ${GITHUB_ENV}

      # install-electron downloads the Electron zip into the OS-default
      # Electron cache dir. Restored here and saved explicitly right after the
      # "Install Electron binary" step below, instead of the combined
      # actions/cache action: that action's save only runs in a post-job step,
      # which is skipped once a later step in the job fails, and the cache
      # would then stay empty.
      - name: Restore Electron cache
        id: electron-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/electron
          key: ubuntu-24.04-arm-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-

      # The same files as in Freelens's own integration tests workflow.
      - name: Use Turborepo cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-arm-turborepo-${{ hashFiles('freelens/package.json', 'freelens/freelens/package.json', 'freelens/packages/**/package.json', 'freelens/pnpm-lock.yaml', 'freelens/turbo.json', 'freelens/tsconfig*.json', 'freelens/packages/infrastructure/typescript/config/*.json') }}
          restore-keys: |
            ubuntu-24.04-arm-turborepo-

      # The binaries that ensure-binaries downloads in "Build extra resources",
      # which Turborepo does not cache (see "Bundled Binary Versions" in
      # Freelens's AGENTS.md). The build hashes every restored binary against
      # the lock and downloads it again on a mismatch. Saved right after that
      # step, as in Freelens's own integration tests workflow.
      - name: Restore bundled binaries cache
        id: binaries-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: freelens/freelens/binaries
          key: ubuntu-24.04-arm-binaries-${{ hashFiles('freelens/freelens/binaries.lock.json') }}
          restore-keys: |
            ubuntu-24.04-arm-binaries-

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The electron package does not download its binary on install. The
      # `predev` script of Freelens runs install-electron, and a
      # `require("electron")` without the binary downloads it, printing a line
      # on stdout before the path. Installed here, the binary is there for the
      # sandbox setup below, and `predev` finds it in place.
      # install.js passes the checksums of the electron package to
      # @electron/get, so no SHASUMS256.txt is downloaded and the cache needs
      # no seeding.
      - name: Install Electron binary
        working-directory: freelens/freelens
        run: pnpm exec install-electron

      # Skipped on an exact cache hit, where actions/cache/save would only warn
      # that it cannot reserve the key; saved on a miss or a restore-key hit,
      # also when the install above failed after the download.
      - name: Save Electron cache
        if: always() && steps.electron-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-cache-restore.outputs.cache-primary-key }}

      # kubectl and freelens-k8s-proxy, which the app needs to connect to a
      # cluster. `pnpm dev` does not download them.
      - name: Build extra resources
        id: build-resources
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Save bundled binaries cache
        if: steps.binaries-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/freelens/binaries
          key: ${{ steps.binaries-cache-restore.outputs.cache-primary-key }}

      - name: Start KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: freelens
          version: v${{ env.kind_version }}
          node_image: kindest/node:v${{ env.kubernetes_version }}
          wait: 5m

      # FREELENS_INTEGRATION_TESTING_DIR gives Freelens dev a fresh profile; the
      # app accepts it only under the system's temporary directory. A dev
      # profile syncs no kubeconfig by default, so the profile is seeded with
      # one sync entry: a file with the kind cluster alone. The catalog then
      # lists that cluster and nothing else.
      - name: Seed the Freelens dev profile
        run: |
          kubeconfig="${RUNNER_TEMP}/kind-freelens.kubeconfig"
          kubectl config view --minify --flatten --context kind-freelens > "$kubeconfig"
          mkdir -p "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev"
          KUBECONFIG_FILE="$kubeconfig" yq -n -o json '.preferences.syncKubeconfigEntries = [{"filePath": strenv(KUBECONFIG_FILE)}]' \
            > "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev/lens-user-store.json"
          cat "${FREELENS_INTEGRATION_TESTING_DIR}/FreelensDev/lens-user-store.json"
        env:
          FREELENS_INTEGRATION_TESTING_DIR: /tmp/freelens-integration-testing

      # Freelens dev, as a developer runs it, with its CDP endpoint on port
      # 9223. It keeps running in the background for the next steps; its output
      # is the main log the tests read. Electron's sandbox helper needs to be
      # setuid root.
      - name: Start Freelens dev
        working-directory: freelens
        run: |
          chrome_sandbox="$(dirname "$(cd freelens && node -p 'require("electron")')")/chrome-sandbox"
          sudo chown root:root "$chrome_sandbox"
          sudo chmod 4755 "$chrome_sandbox"
          nohup xvfb-run -a pnpm dev > "$FREELENS_MAIN_LOG" 2>&1 &
          if ! timeout 900 bash -c 'until curl -sf http://127.0.0.1:9223/json/version; do sleep 5; done'; then
            cat "$FREELENS_MAIN_LOG"
            exit 1
          fi
        env:
          # In GitHub Actions turbo groups the output of a task and prints it
          # when the task ends, which a persistent `dev` task never does.
          TURBO_LOG_ORDER: stream
          FREELENS_INTEGRATION_TESTING_DIR: /tmp/freelens-integration-testing
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log

      - name: Setup node for plugin
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The tests run two sessions against the one app: the install test and
      # the session of the FluxCD views, which applies the Flux CRDs and the
      # test objects to the kind cluster named by TEST_KIND_CLUSTER_NAME, and
      # removes them again.
      #
      # The tests are deterministic, so a failure is not retried. A failing view
      # costs one view timeout.
      - name: Run integration tests
        run: timeout 600 pnpm --color=always test:integration --reporter=verbose --reporter=github-actions --includeTaskLocation
        env:
          FREELENS_MAIN_LOG: ${{ runner.temp }}/freelens-dev.log
          TEST_KIND_CLUSTER_NAME: freelens

      - name: Show Freelens dev output
        if: always()
        run: cat "${{ runner.temp }}/freelens-dev.log" || true
