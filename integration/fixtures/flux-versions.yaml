      - https://github.com/fluxcd/image-reflector-controller/releases/download/v0.29.0/image-reflector-controller.crds.yaml
      - https://github.com/fluxcd/image-automation-controller/releases/download/v0.35.0/image-automation-controller.crds.yaml
    objects:
      - gitrepository-v1.yaml
      - helmrepository-v1beta2.yaml
      - helmchart-v1beta2.yaml
      - bucket-v1beta2.yaml
      - ocirepository-v1beta2.yaml
      - kustomization-v1.yaml
      - helmrelease-v2beta1.yaml
      - imagerepository-v1beta2.yaml
      - imagepolicy-v1beta2.yaml
      - imageupdateautomation-v1beta1.yaml
      - provider-v1beta2.yaml
      - alert-v1beta2.yaml
      - receiver-v1.yaml
