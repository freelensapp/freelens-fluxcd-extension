# The Flux versions of the integration tests, a job of the workflow matrix
# each, chosen so that every model version of the extension is the newest one
# that some Flux serves (see "Flux versions of the integration tests" in
# AGENTS.md). Each lists the CRDs of `manifests/crds` in fluxcd/flux2 at its
# tag, and the test objects from objects/, one per kind, in the version that
# the page of the kind picks on it.
flux:
  v2.0.0:
    crds:
      - https://github.com/fluxcd/source-controller/releases/download/v1.0.0/source-controller.crds.yaml
      - https://github.com/fluxcd/kustomize-controller/releases/download/v1.0.0/kustomize-controller.crds.yaml
      - https://github.com/fluxcd/helm-controller/releases/download/v0.35.0/helm-controller.crds.yaml
