apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: test
spec:
  type: ExternalArtifact
  defaultValues:
    name: test
  selectors:
    - name: test
    - name: test
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: integration-tests
    - matchLabels:
        app: podinfo
      matchExpressions:
        - key: environment
          operator: In
          values:
            - staging
            - production
