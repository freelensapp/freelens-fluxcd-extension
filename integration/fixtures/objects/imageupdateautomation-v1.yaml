apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: test
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: test
  policySelector:
    matchLabels:
      app: podinfo
    matchExpressions:
      - key: environment
        operator: In
        values:
          - staging
          - production
  git:
    commit:
      author:
        name: Flux
        email: flux@example.com
      signingKey:
        type: ssh
        secretRef:
          name: test-signing-key
      messageTemplate: "Update images in {{ .Values.cluster }}"
      messageTemplateValues:
        cluster: test
