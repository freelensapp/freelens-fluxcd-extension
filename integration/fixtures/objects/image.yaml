apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: test
spec:
  image: ghcr.io/stefanprodan/podinfo
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: test
spec:
  imageRepositoryRef:
    name: test
  policy:
    semver:
      range: ">=6.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: test
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: test
  git:
    commit:
      author:
        name: Flux
        email: flux@example.com
