apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: test
spec:
  interval: 1h
  chart:
    metadata:
      labels:
        app.kubernetes.io/part-of: test
      annotations:
        example.com/owner: test
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: test
      reconcileStrategy: Revision
      verify:
        provider: cosign
        secretRef:
          name: test-cosign
  kubeConfig:
    secretRef:
      name: test-kubeconfig
      key: value.yaml
  persistentClient: false
  driftDetection:
    mode: warn
    ignore:
      - paths:
          - /spec/replicas
        target:
          kind: Deployment
      - paths:
          - /metadata/annotations
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: test
    annotations:
      example.com/owner: test
  dependsOn:
    - name: test-infra
      readyExpr: dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  postRenderStrategy: combined
  waitStrategy:
    name: poller
  install:
    timeout: 10m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
      ignoreTestFailures: true
    serverSideApply: true
    disableTakeOwnership: true
    disableWait: true
    disableWaitForJobs: true
    disableHooks: true
    disableOpenAPIValidation: true
    disableSchemaValidation: true
    replace: true
    crds: CreateReplace
    createNamespace: true
  upgrade:
    timeout: 10m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: -1
      remediateLastFailure: true
      strategy: uninstall
    serverSideApply: enabled
    chartNameChangeStrategy: Reinstall
    disableTakeOwnership: true
    disableWait: true
    disableWaitForJobs: true
    disableHooks: true
    disableOpenAPIValidation: true
    disableSchemaValidation: true
    force: true
    preserveValues: true
    cleanupOnFail: true
    crds: Create
  test:
    enable: true
    timeout: 5m
    ignoreFailures: true
    filters:
      - name: test-smoke
      - name: test-slow
        exclude: true
  rollback:
    timeout: 10m
    serverSideApply: auto
    disableWait: true
    disableWaitForJobs: true
    disableHooks: true
    force: true
    cleanupOnFail: true
  uninstall:
    timeout: 10m
    disableHooks: true
    keepHistory: true
    disableWait: true
    deletionPropagation: foreground
  valuesFrom:
    - kind: ConfigMap
      name: test-values
      optional: true
    - kind: Secret
      name: test-image
      valuesKey: tag
      targetPath: image.tag
      literal: true
  healthCheckExprs:
    - apiVersion: example.com/v1
      kind: Database
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      inProgress: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'Unknown')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
